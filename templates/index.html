<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coffee Yield Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
    body {
        background-image: url('{{ url_for("static", filename="bg_ls.png") }}');
        background-size: cover;
    }
</style>
<body>
    <h1 style="color:rgb(54, 1, 1); text-align: center; margin-top:50px"><strong>Coffee Yield Predictor</strong></h1>

    <form method="post" class="d-flex flex-column justify-content-center align-items-center vh-80" style="margin-top: 50px;">
        <div class="mb-3 w-75">
            <label class="form-label text-black"><strong style="color: black; background-color: aqua; opacity: 0.7;">District</strong></label>
            <select name="District" class="form-select">
                {% if prediction_data.get('district', '') %}
                    <option value="{{prediction_data.get('district')}}">{{prediction_data.get('district')}}</option>
                {% endif %}
                <option value="Chikkamagaluru">Chikkamagaluru</option>
                <option value="Hassan">Hassan</option>
                <option value="Kodagu">Kodagu</option>
                <option value="Wayanad">Wayanad</option>
                <option value="Idukki">Idukki</option>
                <option value="Nilgiris">Nilgiris</option>
                <option value="Palakkad">Palakkad</option>
            </select>
        </div>

        <div class="mb-3 w-75">
            <label class="form-label text-black"><strong style="color: black; background-color: aqua; opacity: 0.7;">Season</strong></label>
            <select name="Season" class="form-select">
                {% if prediction_data.get('season', '') %}
                    <option value="{{prediction_data.get('season')}}">{{prediction_data.get('season')}}</option>
                {% endif %}
                <option value="Monsoon">Monsoon</option>
                <option value="Post-Monsoon">Post-Monsoon</option>
                <option value="Winter">Winter</option>
                <option value="Summer">Summer</option>
            </select>
        </div>

        <div class="mb-3 w-75">
            <label class="form-label text-black"><strong style="color: black; background-color: aqua; opacity: 0.7;">Rainfall (mm)</strong></label>
            <input type="number" name="Rainfall_mm" class="form-control" value="{{prediction_data.get('rainfall', 800)}}" step="any">
        </div>

        <div class="mb-3 w-75">
            <label class="form-label text-black"><strong style="color: black; background-color: aqua; opacity: 0.7;">Temperature (°C)</strong> </label>
            <input type="number" name="Temperature_C" class="form-control" value="{{prediction_data.get('temperature', 25)}}" step="any">
        </div>

        <div class="mb-3 w-75">
            <label class="form-label text-black"><strong style="color: black; background-color: aqua; opacity: 0.7;">Soil Moisture (%)</strong></label>
            <input type="number" name="Soil_Moisture" class="form-control" value="{{prediction_data.get('soil_moisture', 35)}}" step="any">
        </div>

        <div class="mb-3 w-75">
            <label class="form-label text-black" ><strong style="color: black; background-color: aqua; opacity: 0.7;">Pest Infestation (%)</strong></label>
            <input type="number" name="Pest_Infestation" class="form-control" value="{{prediction_data.get('pest_infestation', 10)}}" step="any">
        </div>

        <div class="mb-3 w-75">
            <label class="form-label text-black" ><strong style="color: black; background-color: aqua; opacity: 0.7;">Fertilizer Usage (kg/hectare)</strong></label>
            <input type="number" name="Fertilizer_Usage" class="form-control" value="{{prediction_data.get('fertilizer_usage', 100)}}" step="any">
        </div>

        <button type="submit" class="btn btn-success w-25">Predict Yield</button>
    </form>

    {% if prediction %}
        <div class="mt-4 text-center" style="background-color: rgb(170, 187, 251); opacity: 1;">
            <h2 style="color: rgb(255, 0, 0); margin-top: 40px;">
                Predicted Coffee Yield:
                <strong style="color: FFA500;">{{ prediction }} kg/hectare</strong>
            </h2>
        </div>
    {% endif %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
